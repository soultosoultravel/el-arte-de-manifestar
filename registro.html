<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antes de comenzar · El arte de manifestar</title>
<meta name="description" content="El arte de manifestar: de adentro hacia afuera. Un recorrido de 11 sesiones de meditación y escritura.">
<meta name="theme-color" content="#F7F3EC">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#6F6377}a:hover{color:#4F4557}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #6F6377;outline-offset:3px}
input::placeholder{color:#8A8178}
</style>
<link rel="stylesheet" href="sitio.css">
</head>
<body data-pagina="registro">
<div class="pagina" style="width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F3EC; color: #3A3530; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column;">
<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;"><filter id="grano-registro"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.28 0 0 0 0.14 0"></feColorMatrix></filter><rect width="100%" height="100%" fill="#000000" filter="url(#grano-registro)"></rect></svg>
<img src="fotos/textura-03.jpg" alt="" aria-hidden="true" style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; pointer-events: none;">

<div style="position: relative; flex: none; height: 220px; background: #C9BFC9; overflow: hidden; padding: 16px 14px; box-sizing: border-box;">
<img src="fotos/foto-bienvenida.jpg" alt="Collage: silueta de una mujer frente al mar con los brazos en alto, bajo un sol rosado" style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%;">
<a href="introduccion.html" aria-label="Volver a la introducción" style="position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #F7F3EC; color: #3A3530;"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
</div>

<div style="position: relative; box-sizing: border-box; padding: 32px 24px 40px; display: flex; flex-direction: column; gap: 26px;">
<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6F6377;">Antes de la sesión 1</span>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-weight: 500; font-size: 38px; line-height: 1.05; text-wrap: balance;">Antes de comenzar</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4A443D;">Creé este recorrido para compartirlo de manera gratuita, y me emociona saber que tú lo estás siguiendo. Regálame tu nombre y tu correo.</p>
</div>

<form id="registro-form" novalidate aria-labelledby="registro-titulo" style="display: flex; flex-direction: column; gap: 18px; padding: 24px 20px; border-radius: 22px; background: #EFE8DC;">
<h2 id="registro-titulo" style="margin: 0; font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.15;">Tus datos</h2>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="registro-nombre" style="font-size: 13px; font-weight: 600; color: #3A3530;">Tu nombre</label>
<input id="registro-nombre" type="text" autocomplete="given-name" name="nombre" required placeholder="Escribe tu nombre" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #CFC5B4; border-radius: 12px; background: #F7F3EC; color: #3A3530; font-family: 'Hanken Grotesk', Arial, sans-serif; font-size: 16px;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="registro-correo" style="font-size: 13px; font-weight: 600; color: #3A3530;">Tu correo</label>
<input id="registro-correo" type="email" autocomplete="email" inputmode="email" name="correo" required placeholder="nombre@correo.com" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #CFC5B4; border-radius: 12px; background: #F7F3EC; color: #3A3530; font-family: 'Hanken Grotesk', Arial, sans-serif; font-size: 16px;">
</div>
<label for="registro-autoriza" style="display: flex; gap: 12px; align-items: flex-start; min-height: 44px; font-size: 13px; line-height: 1.55; color: #4A443D; cursor: pointer;">
<input id="registro-autoriza" type="checkbox" name="autoriza" required style="flex: none; width: 20px; height: 20px; margin: 1px 0 0; accent-color: #6F6377;">
<span>Autorizo el tratamiento de mis datos según la <a href="#" style="color: #6F6377; text-decoration: underline; text-underline-offset: 3px;">política de tratamiento de datos</a>.</span>
</label>
<p role="alert" data-role="error" hidden style="margin: 0; font-size: 13px; line-height: 1.5; color: #7A3F3A;"></p>
<button type="submit" style="display: flex; align-items: center; justify-content: center; height: 54px; border: none; border-radius: 999px; background: #3A3530; color: #F7F3EC; font-family: 'Hanken Grotesk', Arial, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;">Continuar</button>
</form>

<p style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.4; color: #6B6259; text-align: center;">Solo te lo pediremos una vez.</p>
</div>
</div>
<script src="sitio.js"></script>
</body>
</html>
